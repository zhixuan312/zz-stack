# The repository gate, on every push to master.
#
# Why this exists: nothing ran the gate except a release, so a stale plugin shelf, a check that
# disagrees with live data, or a build that no longer compiles sat on master until somebody cut a
# release — which is when it is most expensive to find. 0.83.1 is the worked example: it deployed,
# failed one doctor probe and could not be rolled back, and the console's gate failed inside a
# release while passing on every manual run.
#
# FOUR things this workflow got wrong before it worked, each found by reading a failing run rather
# than by announcing a fix:
#
#  1. `docker pull ghcr.io/zhixuan312/zz-postgres` is denied — the package is private and a package
#     grants GITHUB_TOKEN access only to repositories explicitly linked to it.
#  2. `docker build deploy/postgres` fails: line 43 of the Dockerfile copies
#     `deploy/postgres/postgresql.conf`, a path relative to the REPO ROOT, so the context is the
#     root and the Dockerfile is the argument.
#  3. **The console must be checked out as a SIBLING.** `checks/gateways-routes-have-callers.ts`
#     reads the console's API calls to prove every route this gateway serves has a caller, and it
#     REFUSES to pass when the console is absent: "not evidence that they have none". So both
#     repositories are checked out under `pair/`, and every step runs from `pair/zz-stack`, which
#     makes `../zz-stack-dashboard` resolve exactly as it does in a developer's checkout.
#  4. Two overlapping runs fail each other: `checks/candidate-build-live.ts` asserts the
#     machine-global candidate build root is as it found it. Hence `concurrency` below.
name: gate

on:
  push:
    branches: [master]
  workflow_dispatch:

# One run per branch, queued rather than cancelled: a push must never go untested.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Every step runs as if from a developer's checkout, one directory below the console's.
    defaults:
      run:
        working-directory: pair/zz-stack
    steps:
      - uses: actions/checkout@v4
        with:
          path: pair/zz-stack
          # The tags too: "the version that shipped has a changelog section of its own" asks git
          # whether this version is tagged, and a checkout without tags answered "not yet released"
          # every time, so the check never ran here.
          fetch-tags: true

      # Both repositories are public, so the default token reads the console without a secret.
      - uses: actions/checkout@v4
        with:
          repository: zhixuan312/zz-stack-dashboard
          path: pair/zz-stack-dashboard

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Built, not pulled: the image is pinned by digest and by the extension commit in
      # `deploy/postgres/versions.lock.json`, so building it needs no secret at all and proves the
      # Dockerfile still builds. The tag is written to match what `deploy/docker-compose.yml` names,
      # so the inventory check's `docker run` finds it locally.
      - name: Build the pinned PostgreSQL the inventory check migrates
        run: docker build -f deploy/postgres/Dockerfile -t ghcr.io/zhixuan312/zz-postgres:17.11-pgts1.4.0 .

      - run: npm ci

      # The three commands the plan's "Full-suite gate" fixes, in its order.
      - name: Typecheck the workspace
        run: npx tsc -b

      - name: Typecheck the tooling project
        run: npx tsc -p tsconfig.tooling.json --noEmit

      - name: The gate
        run: node scripts/gate.ts --quiet
