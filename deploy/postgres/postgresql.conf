# deploy/postgres/postgresql.conf — the configuration this pinned PostgreSQL 17 image ships.
# testing/tenant-info/deployment.ts's validateImageInputs reads this file back: the exact
# preload membership (not merely the setting's presence) must include pg_textsearch, and the
# five reference settings below must be exactly the spec's values, not a guessed nearby one.
#
# pg_textsearch, added to whatever this deployment already preloaded. The database this
# replaced, postgres:16-alpine, ran on its own default configuration and set no custom
# shared_preload_libraries at all — there was nothing else to preserve, so the one addition
# below IS the whole list, not a partial one that dropped something on the way in.
shared_preload_libraries = 'pg_textsearch'

# LISTEN ON EVERY INTERFACE, because this file REPLACES the image's own configuration.
#
# `CMD ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]` points the server at
# this file instead of the one the official image ships, and PostgreSQL's built-in default for
# an unset `listen_addresses` is 'localhost'. The result is a database container reachable only
# from inside itself: `docker exec psql` works, every other container gets ECONNRESET, and the
# logs say "listening on IPv4 address 127.0.0.1" to anybody who reads them.
#
# Found by restoring a real backup into this image and pointing the suites at it — the first
# thing in this delivery to connect over TCP rather than through `docker exec`. On the
# production deployment it would have meant zz-core could not reach its database at all, on
# the one change that also moves every tenant's records.
#
# '*' rather than a specific address: the container's address is assigned by the compose
# network and is not knowable here, and the port is published only where compose says.
listen_addresses = '*'

# Reference settings — spec.md's "PostgreSQL image and dependency lock" section, verbatim.
# Not guessed configuration names: these five and only these five are the agreed contract.
shared_buffers = 8GB
work_mem = 16MB
maintenance_work_mem = 512MB
max_parallel_maintenance_workers = 2
autovacuum = on

# Extension-specific compaction/memory settings for pg_textsearch are deliberately absent.
# The contract only permits setting one if it is actually present in the pinned release and
# recorded in the feature report (artifacts/tenant-info-v4/extension-features.json) — neither
# of which exists yet from this checkout, so inventing a plausible-looking GUC name here
# would be exactly the fabrication the contract forbids.
#
# enable_seqscan is never set to off here, on purpose — forcing the planner off sequential
# scan would manufacture a plan-shaped pass instead of proving the index is actually chosen.
# Its absence IS the compliant state; do not add `enable_seqscan = off` "to be safe".
#
# Connection, WAL, replication and other production tuning are out of this task's contract —
# this is a dependency-proof image, not yet the full AC-7.2 deployment. Creating it does not
# authorize migration or production cutover.
