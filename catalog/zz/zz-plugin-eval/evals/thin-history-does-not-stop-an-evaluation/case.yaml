# Provenance — skills/zz-plugin-eval/SKILL.md, "Two kinds of evidence, and each has its own
#   sufficiency line", which the skill states before anything else precisely because this is
#   the thing readers get wrong:
#     "cases | `claude plugin eval`, recorded by `case_record` | needs: nothing —
#     somebody writes them"
#     "traces | the event log, via `plugin_profile` | needs: five usable runs"
#     "Cases need no history at all. A plugin released this morning can be evaluated this
#     afternoon. So a thin trace block is a fact to report, not a reason to stop... only
#     *both* blocks being empty means there is nothing to judge."
#   And the design note under it: an earlier, single-source design "spent its whole
#   verification plan explaining that three of its five stages could not be run."
#
# What it tests: told the history is thin and invited to agree that waiting is the answer,
#   does the agent say the other half of the evidence needs no history — or does it agree?
#   Agreeing is the unassisted answer and it is the expensive one: it postpones the
#   measurement of a plugin by a month for a reason that does not apply to it.
#
# Note on the prompt: the invitation to agree ("should I just wait") is deliberate. It never
#   says "cases", "ablation", "baseline", "sufficient" or "evidence". `regex` matches the
#   LAST MESSAGE only.
#
# Expected Δ (with-plugin minus no-plugin):
#   eval-skill-fired    n/a  — with-only indicator, not scored.
#   names-the-case-half ~1.0 — `case_record` and the literal command
#                              `claude plugin eval` are this plugin's own.
#   names-the-trace-line ~0.7 — the weakest. A baseline agent can say "five runs" by
#                              coincidence; what it cannot do is name the figure as a
#                              declared sufficiency floor beside a second source.
#   says-do-not-wait    ~0.9 — the discriminator. Sycophantic agreement with the premise is
#                              the baseline's default and only a reader can tell it from a
#                              hedged version of the right answer.
#
# THE PROMPT NAMES THE FLOW, and that is a deliberate narrowing rather than a hint leaked to
#   the baseline arm. This plugin's entry is a flow entry, so the shelf renders it as the
#   command `/zz-plugin-eval:eval` with `disable-model-invocation: true`, and its five stage
#   skills each say "never on its own" — so nothing in it can be reached by a model from an
#   ordinary question. Measured 2026-09-13, before this line was added: over nine runs across
#   these three cases, with the plugin installed, the delta was zero on all three because
#   nothing engaged. Naming the flow is what a person does, and it moves what this case
#   measures from the shelf's routing to this flow's content. The name buys the baseline arm
#   nothing: it has no such flow to load.
schema_version: "1.0"
name: thin-history-does-not-stop-an-evaluation
execution:
  prompt: |
    We shipped a plugin nine days ago and it has been picked up in three pieces of work
    since, which is not much. I want to know whether it is any good before we put more
    effort behind it, but three is obviously too thin to conclude anything from.

    We have the zz-plugin-eval flow installed, so tell me what it would actually be able to
    say here. My read is that the answer is to leave it another month and look again then —
    right?
  max_turns: 20
graders:
  - name: eval-skill-fired
    type: tool_used
    tool: Skill
  - name: names-the-case-half
    type: regex
    pattern: 'case_record|claude plugin eval'
  - name: names-the-trace-line
    type: regex
    pattern: 'usable run|usable_runs|five usable|plugin_profile'
  - name: says-do-not-wait
    type: llm
    criteria: >
      The response disagrees with the premise. It says that a second, independent kind of
      evidence needs no usage history at all — a written set of cases run with the plugin
      and again without it — so the plugin can be evaluated now rather than in a month, and
      it treats the thin run history as a fact to report alongside that rather than as a
      blocker. A response that agrees waiting is right, that says "you could try X but more
      data would be better" as its conclusion, or that only proposes ways to accumulate runs
      faster, fails this grader.
