# Provenance — initiative 2026-09-12-plugin-level-eval.
#   Spec v1 asserted that a tool was absent from a plugin's MCP surface and built a
#   requirement on top of that absence. Two minutes reading flow.json and access-door.ts
#   disproved it. The claim read cleanly, was internally consistent, and was false — the
#   only thing that catches that class of defect is an auditor that goes and looks.
#   sdlc-audit-criteria calls this the "wrong-claim" evidence shape: quote the doc's claim
#   AND the source that contradicts it.
#
# The false claim below is the same shape, aimed at a file that ships INSIDE this plugin
#   so the case needs no repository: it says flow.json declares no `standalone` entry.
#   flow.json declares three — sdlc-deck, sdlc-tldr, sdlc-breakout — and sdlc-flow's own
#   SKILL.md says of them "No order, no gate, no initiative required." Either file
#   disproves it, which is deliberate: if `flow.json` is not present in the eval scaffold,
#   the SKILL.md tools table still is.
#
# Framing: this prompt addresses the agent AS the dispatched auditor, which is literally
#   sdlc-audit-criteria's `when_to_use`. That is on purpose — sdlc-method dispatches audits
#   to a subagent, and a Skill call inside a subagent may not reach the main transcript
#   where `tool_used` looks. Dispatched framing keeps the Skill load and the JSON envelope
#   both in the main run. (audit-sends-a-flawed-spec-back deliberately takes the other
#   framing, so the pair covers both.)
#
# What it tests: given a spec making a checkable reachability claim about the codebase,
#   does the audit go READ the cited source instead of accepting the claim?
#
# MEASURED — one baseline (no-plugin) run, 2026-09-13, score 0.40. What it taught:
#   - `regex` matches the run's LAST MESSAGE only ("pattern not found in last_message"),
#     not the whole transcript. Every pattern here has to survive into the final answer.
#   - The bare agent called Read 3x unprompted, so a plain `tool_used: Read` grader scored
#     in the baseline arm too (Δ ≈ 0). It has been REMOVED; the ordered form below keeps
#     the signal and fails the baseline for want of any Skill call at all.
#   - The bare agent matched a `standalone` pattern, because the word is quoted in the
#     prompt. Narrowed to `sdlc-tldr`, which appears nowhere in the prompt and can only
#     come from reading the plugin.
#
# Expected Δ (with-plugin minus no-plugin):
#   spec-audit-skill-fired       ~1.0 — measured 0 in baseline; the skill does not exist there.
#   read-after-loading-the-skill ~1.0 — measured 0 in baseline (no Skill call to order against).
#   found-the-disproof           ~0.9 — naming `sdlc-tldr` means it found the contradicting
#                                       fact rather than hedging about the claim.
#   returned-the-round-envelope  ~1.0 — measured 0 in baseline; `criteriaCovered` is the
#                                       audit's required output shape and nothing outside
#                                       the plugin emits it.
schema_version: "1.0"
name: audit-catches-an-unverified-claim
execution:
  prompt: |
    You were dispatched as sdlc-spec-audit, round 1, on
    2026-09-12-plugin-level-eval/spec.md. No previous round has run. Here is the component
    you are auditing:

    ## Approach, Method & Structure

    ### Why a new stage is needed

    The flow currently has no way for a person to compress a long thread or document down
    to what a reader needs. Per the flow's own `flow.json`, every skill the flow ships is
    declared as an entry under `stages` — so every one of them is reachable only from
    inside a live initiative that has already passed the earlier gates. A person holding a
    long document, with no initiative open, has nothing in this flow to reach for.

    ### The change

    **FR-3** — The flow MUST add an `sdlc-summarise` stage, sequenced after `sdlc-review`
    and before the close, which takes a document or thread and produces a compressed
    version of it.

    Return your round.
  max_turns: 25
graders:
  - name: read-after-loading-the-skill
    type: tool_order
    before: Skill
    after: Read
  - name: found-the-disproof
    type: regex
    pattern: 'sdlc-tldr'
  - name: returned-the-round-envelope
    type: regex
    pattern: 'criteriaCovered'

# MEASURED 2026-09-13, and one grader was removed because of it. `tool_used:
# Skill(sdlc-spec-audit)` scored 0 in all three with-arm runs while the other three graders
# scored 1.0 — not because the plugin failed, but because sdlc-method DISPATCHES an audit to a
# subagent, so the Skill call happens in a child transcript the parent's tool log never sees.
# A grader that can only ever fail is a grader measuring the harness, and averaging it in
# understated the plugin by a quarter on every run. `read-after-loading-the-skill` carries the
# signal that a skill fired at all, from the parent's own log.
