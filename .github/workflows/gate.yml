# The repository gate, on every push to master, so a stale plugin shelf, a check that disagrees
# with live data or a build that no longer compiles is found on the push rather than in a release.
#
# Constraints the steps below follow:
#
#  1. The console is checked out as a SIBLING. The check "every route this gateway serves has a
#     caller" reads the console's API calls and refuses to pass when the console is absent. Both
#     repositories are checked out under `pair/`, and every step runs from `pair/zz-stack`, so
#     `../zz-stack-dashboard` resolves exactly as it does in a developer's checkout.
#  2. Two overlapping runs fail each other: `checks/candidate-build-live.ts` asserts the
#     machine-global candidate build root is as it found it. Hence `concurrency` below.
name: gate

on:
  push:
    branches: [master]
  workflow_dispatch:

# Both checkouts are public and nothing is published, so the token reads and nothing more.
permissions:
  contents: read

# One run per branch, queued rather than cancelled: a push must never go untested.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    # 22.04, not `ubuntu-latest`, for the reason images.yml gives: the gate's candidate checks need a
    # working bwrap, and on 24.04 an AppArmor rule lets bwrap start a trivial command and refuse the
    # build's own spec. With none they skip (they must, inside a candidate's own sandboxed build), so
    # the step below proves one before the gate, or they would never run here.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # Every step runs as if from a developer's checkout, one directory below the console's.
    defaults:
      run:
        working-directory: pair/zz-stack
    steps:
      - uses: actions/checkout@v4
        with:
          path: pair/zz-stack
          # The tags too: "the version that shipped has a changelog section of its own" asks git
          # whether this version is tagged, and a checkout without tags answers "not yet released".
          # Full depth, because `fetch-tags` on the default one-commit clone fetches none.
          fetch-depth: 0
          fetch-tags: true

      # Both repositories are public, so the default token reads the console without a secret.
      - uses: actions/checkout@v4
        with:
          repository: zhixuan312/zz-stack-dashboard
          path: pair/zz-stack-dashboard

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # The sandbox is proved by the code's own detector, which imports built output, so the
      # workspace is built once before the proof. `test:release` builds again; `tsc -b` is
      # incremental and the second run is the one that must pass.
      - name: Build the workspace the gate reads
        run: npm run build

      # Proved by the code's own detector after the build, as images.yml does, rather than found
      # missing inside the gate.
      - name: Install and prove the sandbox the gate's candidate checks use
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          node -e "import('./packages/tools/dist/candidate/sandbox.js').then((m) => {
            const t = m.detectSandbox();
            if (t !== 'bwrap') { console.error('no working sandbox on this host: ' + t); process.exit(1); }
            console.log('sandbox: ' + t);
          })"

      # The only test command CI runs, here and in every other workflow. It builds (`tsc -b` and the
      # document panel), type-checks the tooling project, and runs every check.
      - name: test:release
        run: npm run test:release
