# ZZ delivery stack. Runs PUBLISHED IMAGES — no repository, no build, no toolchain.
#
#   cp .env.example .env        # fill in keys
#   docker compose up -d
#   ./issue-first-pat.sh        # the one token that opens the platform
#
# then give that token to your MCP client — `client_setup` on the access door prints the
# configuration for it.
#
# The versions are written into this file, not asked of whoever installs it. This file
# and the images it names are one release: a person receiving it has no way to know what
# to type, and asking them to would make the wrong answer possible. The release command
# rewrites the literals below and ships the result.
#
# Rolling back is editing the literal and running `docker compose up -d` again — seconds,
# no rebuild. ZZ_VERSION in the environment still overrides, which is
# what the release script uses to switch a host and what makes a rollback one edit.
#
# To develop against a checkout instead, layer the build override on top:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# which builds both images from source and mounts ../catalog and ../skills over the
# copies inside them, so editing a skill stays instant.
services:
  # The platform's store and tools. Reached from outside only through the gateway below.
  zz-core:
    image: ${ZZ_IMAGE:-ghcr.io/zhixuan312/zz-stack}:${ZZ_VERSION:-0.79.2}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      - SERVICE=zz-core
      # The platform database. Teams come from zz.membership and nowhere else.
      # Falls back to the postgres this compose starts, for a fresh install that has set
      # nothing. An existing deployment sets TEAM_DB_URL and that always wins.
      - TEAM_DB_URL=${TEAM_DB_URL:-postgresql://${POSTGRES_USER:-zz}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD — openssl rand -hex 16}@postgres:5432/${POSTGRES_DB:-zz}}
      # Who may assert an identity to this port. zz-core reads the caller from the forwarded
      # headers and trusts them, so it answers only the hosts named here. Passed through
      # rather than left to the code's default, because .env.example documents it as
      # settable — a knob a person can set in .env and that never reaches the container is
      # worse than no knob at all.
      - TRUSTED_PEERS=${TRUSTED_PEERS:-}
      # The deployment's own timezone: every date the platform stamps is local to it. Under UTC
      # a morning east of Greenwich lands under yesterday's date.
      - ZZ_TZ=${ZZ_TZ:-}
      # The reading judge — failure_discover's critic proposes a description through it.
      # DELIBERATE: a different model from the one the flows' agents run on; a critic exactly as
      # good as the thing it reads describes nothing. Unset, the critic is skipped and the
      # deterministic description stands, with the reason recorded.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - ZZ_JUDGE_MODEL=${ZZ_JUDGE_MODEL:-deepseek-v4.1-flash}
      - ZZ_JUDGE_THINKING=${ZZ_JUDGE_THINKING:-on}
      # The typed judge, which answers shapes rather than sentences: a position on named levels,
      # one word from a closed set, a yes/no. It marks a ruler whose dimensions name their levels.
      #
      # DELIBERATE: optional. With no key the reading judge marks every ruler, and the report
      # names the recommendation as absent with the reason. A third party that can stop an
      # evaluation existing is a dependency nobody agreed to.
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - TYPESAFE_MODEL=${TYPESAFE_MODEL:-jev-latest}
      - TYPESAFE_BASE_URL=${TYPESAFE_BASE_URL:-}
      # The team that owns every catalog plugin (FR-2, FR-47). Not read by this service at
      # request time — zz.plugin.owner_team, written once by register-plugins, is what
      # plugin_locate answers from — but register-plugins runs inside this same image, through
      # `./deploy/zz-tool register-plugins`, and this is how that run reaches it. Empty by
      # default: only register-plugins refuses on an unset value, so an install that never
      # registers a plugin is unaffected.
      - ZZ_CATALOG_OWNER_TEAM=${ZZ_CATALOG_OWNER_TEAM:-}
    volumes:
      # /catalog and /skills ship inside the image — see the root Dockerfile.
      # docker-compose.build.yml mounts the working tree back over them for development.
      - zz-artifacts:/artifacts            # team/per-user .zz stores
    # DELIBERATE: INTERNAL_BIND, never the gateway's bind. zz-core has no authentication of its
    # own and trusts the identity headers it is sent, so published beyond loopback it would
    # answer anyone as anyone. The gateway is the authenticated door; /core/mcp reaches this.
    ports: ["${INTERNAL_BIND:-127.0.0.1}:${ZZ_CORE_PORT:-8763}:8000"]

  # The gateway: the one authenticated door. Same image as zz-core, a different SERVICE.
  cred-proxy:
    image: ${ZZ_IMAGE:-ghcr.io/zhixuan312/zz-stack}:${ZZ_VERSION:-0.79.2}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      - SERVICE=gateway
      # platform truth: zz schema in the shared postgres; superadmin seed
      # Falls back to the postgres this compose starts, for a fresh install that has set
      # nothing. An existing deployment sets TEAM_DB_URL and that always wins.
      - TEAM_DB_URL=${TEAM_DB_URL:-postgresql://${POSTGRES_USER:-zz}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD — openssl rand -hex 16}@postgres:5432/${POSTGRES_DB:-zz}}
      # DELIBERATE: empty by default. db.ts falls back to TEAM_DB_URL, the same database — the
      # platform's tables are its `zz` schema. A literal default here names a user or database
      # the deployment may not have.
      - PLATFORM_DB_URL=${PLATFORM_DB_URL:-}
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL:-}
      # The first team. A deployment with a superadmin and no team looks healthy and
      # is not: teamFor() returns null, so every document lands in a per-user store
      # instead of the team's, and nobody notices until they go looking for it.
      - BOOTSTRAP_TEAM=${BOOTSTRAP_TEAM:-}
      # The model the flows' own agents run on. The judge must not be this one.
      - PLATFORM_BASE_MODEL=${PLATFORM_BASE_MODEL:-}
      # The gateway generates too — /api/console/ask — so it needs the endpoint as well as the
      # model name. Set in .env is not the same as seen by this container.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - GATEWAY_PUBLIC_URL=${GATEWAY_PUBLIC_URL:-}
      # Origins other than loopback that an MCP client may register a redirect on,
      # comma-separated. Normally empty: native clients redirect to 127.0.0.1, which is
      # allowed by rule (RFC 8252). Set this only for a browser front end.
      - OAUTH_REDIRECT_ORIGINS=${OAUTH_REDIRECT_ORIGINS:-}
      # The admin console's passkey sign-in. This one value IS the relying party: its
      # hostname becomes the RP ID and its origin the expected origin, so the two can never
      # be spelled apart. Unset and /auth/* answers 503 rather than guessing an origin from
      # the Host header. A registered passkey is bound to the hostname in here — change it
      # and everybody re-enrols. See deploy/.env.example.
      - CONSOLE_PUBLIC_URL=${CONSOLE_PUBLIC_URL:-}
      - CORE_MCP_URL=${CORE_MCP_URL:-http://zz-core:8000/mcp}
      # The one host whose forwarded identity headers this gateway accepts. Same reason as
      # TRUSTED_PEERS on zz-core above.
      - TRUSTED_FORWARD_HOST=${TRUSTED_FORWARD_HOST:-}
    volumes:
      - cred-data:/data
      - zz-artifacts:/artifacts:ro    # the console reads documents and knowledge from it
    # The only service that may be published beyond loopback: it authenticates every request
    # itself, and Caddy proxies the public host to it.
    ports: ["${GATEWAY_BIND:-127.0.0.1}:${CRED_PROXY_PORT:-8764}:8000"]

  # The platform's database. Not optional and behind no profile: every service above defaults
  # to it, and the gateway keeps teams, people, tokens, grants and the document index in it.
  postgres:
    image: ghcr.io/zhixuan312/zz-postgres:17.11-pgts1.4.0
    restart: unless-stopped
    # Sized to the host. The image ships the specification's reference settings, and
    # `shared_buffers = 8GB` stops PostgreSQL 17 starting at all on a small machine.
    #
    # DELIBERATE: overridden here, not in the conf the image ships, so the reference values stay
    # readable and a larger host has one line to delete.
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf",
              "-c", "shared_buffers=512MB", "-c", "maintenance_work_mem=128MB"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-zz}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD — openssl rand -hex 16}
      - POSTGRES_DB=${POSTGRES_DB:-zz}
    volumes:
      # DELIBERATE: the name carries the major version. A new major cannot start on the old
      # one's data directory, and a shared name invites deleting the cluster to "fix" it. The
      # next major gets `postgres-data-18` and a logical dump-and-restore, which also rebuilds
      # every index under the new collation.
      #
      # Recovery is forward, from ~/zz-backups on the host: restore into a fresh volume. See
      # deploy/RESTORE-AND-CUTOVER.md.
      - postgres-data-17:/var/lib/postgresql/data
    ports: ["${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"]   # bind to a tailscale IP to make the DB tailnet-only
    # COUPLED: the `depends_on` above waits on this. zz-core's boot reindex, which removes rows
    # for files deleted while it was down, does not retry, so it must not run before the
    # database accepts connections. No arguments: a role name here would be a second place to
    # keep POSTGRES_USER in step.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  cred-data:
  postgres-data-17:
  zz-artifacts:
