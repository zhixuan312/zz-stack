# Build and publish this release's images, on a runner, so a machine without Docker can still
# release.
#
# What this is for: `scripts/release.ts` builds both images locally before it deploys them, which
# makes Docker a prerequisite for releasing anywhere. This workflow runs everything the release
# would run WITHOUT touching the host — the gate, both image builds, the platform stood up from
# them, `sql-check` over every query, the tool-chain walk and the deploy bundle — and then pushes
# the two tags it produced. The release that follows runs on the machine that holds the deploy key,
# with `--gate-in-ci --images-from-ci`, and needs no Docker at all.
#
# What it does NOT do: deploy, verify against the live host, or tag. Those need the deploy key, and
# keeping it out of GitHub is the point of the split.
#
# Requirements, all one-time:
#   * each package is linked to its repository with Write access, which is what lets this workflow's
#     own GITHUB_TOKEN push to it — a package setting GitHub has no API for on a user-owned package;
#   * `vars.ZZ_PUBLIC_URL` is set, because the dry run resolves the deployment's public address and
#     a runner has no host to read it from;
#   * `vars.ZZ_CATALOG_OWNER_TEAM` is set, because `register-plugins` writes it as every catalog
#     plugin's owner and release_owners and refuses to run without it. The deploy host carries both
#     variables in `deploy/.env`, which is gitignored, so a runner has to be given them.
name: images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "the platform version to build, e.g. 0.88.1 (must match the tree's manifests)"
        required: true
        type: string
      dashboard:
        description: "the console version, when it moved (e.g. 0.22.2) — empty to leave it alone"
        required: false
        type: string
      push:
        description: "publish the images. Turn this OFF to verify a tree without touching the tags a deployment runs"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

# One image build per version, queued rather than cancelled: two builds of one version would race
# for the same two tags.
concurrency:
  group: images-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Every step runs as if from a developer's checkout, one directory below the console's: the
    # release resolves the console at `../zz-stack-dashboard`.
    defaults:
      run:
        working-directory: pair/zz-stack
    steps:
      - uses: actions/checkout@v4
        with:
          path: pair/zz-stack

      - uses: actions/checkout@v4
        with:
          repository: zhixuan312/zz-stack-dashboard
          path: pair/zz-stack-dashboard

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The dry run migrates a throwaway PostgreSQL built from this image, so it has to exist
      # before the run starts — the same reason gate.yml builds it.
      - name: Build the pinned PostgreSQL the dry run migrates
        run: docker build -f deploy/postgres/Dockerfile -t ghcr.io/zhixuan312/zz-postgres:17.11-pgts1.4.0 .

      - run: npm ci

      # The release's first act is the gate, and the gate's checks import the workspace packages'
      # built output — `@zz/indexing/dist/index.js` and its siblings — which a fresh checkout does
      # not have. The same `tsc -b` gate.yml runs before its own gate, and it was the one step this
      # workflow was missing: the first verify run died at "1 · gate" with ERR_MODULE_NOT_FOUND.
      - name: Build the workspace the gate reads
        run: npx tsc -b

      # The release runs the console's own suite (`pnpm run typecheck`, `lint`, `test`, `gate`) out
      # of its checkout, and installs nothing there itself. pnpm because zz-stack-dashboard declares
      # `packageManager: pnpm@10.33.0` and carries a pnpm lockfile; the version is pinned to that
      # field rather than to a floating latest.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install the console's dependencies
        working-directory: pair/zz-stack-dashboard
        run: pnpm install --frozen-lockfile

      # The whole release, minus the host: the gate, both images, the platform started from them,
      # sql-check, the tool-chain walk, the deploy bundle. A failure here is a failure the release
      # would have hit, found before anything is pushed.
      - name: Everything the release runs, without touching the host
        env:
          ZZ_PUBLIC_URL: ${{ vars.ZZ_PUBLIC_URL }}
          ZZ_CATALOG_OWNER_TEAM: ${{ vars.ZZ_CATALOG_OWNER_TEAM }}
        run: |
          node scripts/release.ts '${{ inputs.version }}' \
            ${{ inputs.dashboard != '' && format('--dashboard={0}', inputs.dashboard) || '' }} \
            --dry-run --fit-for-purpose-reviewed

      # The whole zz-plugin-eval flow, from IDENTIFY to a closed initiative, through the real doors
      # of a scratch stack this step stands up and tears down: candidate, its sandboxed build, the
      # release, the rollback, and the post-release judgement on real use. Nothing else runs it —
      # it needs docker and minutes, so it is not a gate check — and the improve/release half is
      # the one part of the platform no production run has exercised yet.
      - name: Walk the whole eval flow, improve through release and rollback
        run: npm run eval-flow-e2e

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # Only the tags this run built, named one by one: a `--all-tags` push would publish whatever
      # else happens to be in the runner's daemon.
      - name: Publish this release's images
        if: ${{ inputs.push }}
        run: |
          docker push ghcr.io/zhixuan312/zz-stack:${{ inputs.version }}
          if [ -n '${{ inputs.dashboard }}' ]; then
            docker push ghcr.io/zhixuan312/zz-stack-dashboard:${{ inputs.dashboard }}
          fi
