# deploy/postgres/postgresql.conf — the configuration this pinned PostgreSQL 17 image ships.
# COUPLED: checks/postgres-image-pinned.ts reads it back: the preload list must not be empty and
# must name every library versions.lock.json lists.
#
# pg_textsearch is the whole preload list.
shared_preload_libraries = 'pg_textsearch'

# Listen on every interface. This file replaces the image's own configuration, and PostgreSQL's
# default for an unset `listen_addresses` is 'localhost', which leaves the database reachable
# only from inside its own container. '*' because the compose network assigns the address; the
# port is published only where compose says.
listen_addresses = '*'

# Sized for a large host. DELIBERATE: deploy/docker-compose.yml overrides shared_buffers and
# maintenance_work_mem on its command line, because 8GB stops PostgreSQL starting at all on a small
# machine.
shared_buffers = 8GB
work_mem = 16MB
maintenance_work_mem = 512MB
max_parallel_maintenance_workers = 2
autovacuum = on

# DELIBERATE: enable_seqscan is never off. Forcing the planner off sequential scans would make
# a plan look indexed instead of proving the index is chosen.
