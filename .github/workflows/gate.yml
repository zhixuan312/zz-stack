# The repository gate, on every push to master.
#
# Why this exists: nothing ran the gate except a release, so a stale plugin shelf, a check that
# disagrees with live data, or a build that no longer compiles sat on master until somebody cut a
# release — which is when it is most expensive to find. 0.83.1 is the worked example: it deployed,
# failed one doctor probe and could not be rolled back, and the console's gate failed inside a
# release while passing on every manual run.
#
# The gate needs Docker: `checks/schema-inventory.ts` starts a throwaway PostgreSQL from the image
# `deploy/docker-compose.yml` names and migrates it with the real runner, because a static reading
# of the SQL cannot see nullability, foreign-key actions or defaults as PostgreSQL resolves them.
# That image is `ghcr.io/zhixuan312/zz-postgres`, built in this repository's namespace with the
# `pg_textsearch` extension, so the login below is what lets the runner pull it.
name: gate

on:
  push:
    branches: [master]
  workflow_dispatch:

# One run per branch, queued rather than cancelled: a push must never go untested, and
# `checks/candidate-build-live.ts` asserts the machine-global candidate build root is exactly as it
# found it — so two runs on one machine each see the other's directory and both fail. The platform's
# own rule is already that gates run serially.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the pinned PostgreSQL the inventory check migrates
        run: docker pull ghcr.io/zhixuan312/zz-postgres:17.11-pgts1.4.0

      - run: npm ci

      # The three commands the plan's "Full-suite gate" fixes, in its order.
      - name: Typecheck the workspace
        run: npx tsc -b

      - name: Typecheck the tooling project
        run: npx tsc -p tsconfig.tooling.json --noEmit

      - name: The gate
        run: node scripts/gate.ts --quiet
