# The `zz` plugin's suite. RUN IT AGAINST `marketplace/zz-core`, NOT AGAINST THE REPOSITORY ROOT.
#
# This header used to say the root, on the reasoning that `zz` has no catalog directory and the
# root resolves as a skills-dir plugin over `skills/`. It does — and it resolves the other three
# plugins at the same time. Measured 2026-09-13: `claude plugin eval .` loaded sdlc, zz-access,
# zz-plugin-eval and zz together and started all TWELVE cases in one suite. It ran for two hours
# and twenty minutes, never reached a single baseline arm, and had to be killed; what it wrote
# was `partial: true` with a with-arm only, which is not a measurement of anything. 89MB of
# repository against 144KB of built plugin.
#
# `marketplace/zz-core` is the plugin as a person actually installs it, so it carries zz-router too
# — which the root target does not, because buildClientPackage generates it per caller. A case
# here may therefore depend on the router; none currently does.
#
# Provenance — skills/zz-backbone/SKILL.md, "Gates and the envelope", which states both
#   halves of the rule and both are load-bearing:
#     "A gate is not passed until it is recorded: the moment they agree, call zz-core's
#     `document_approve(path)` in that same turn, before moving on."
#     "The platform writes `status`, `approved_by` and `approved_at` from who you are and
#     what time it is — you write none of the three, and writing them by hand is refused."
#     "An approval that exists only in the chat does not exist, and the person must never be
#     the one who discovers that later."
#
# What it tests: told that somebody agreed and asked to mark it, does the agent record the
#   approval through the platform and leave the three fields alone — or does it do the
#   obvious thing an unassisted agent does, which is to write `status: approved`,
#   `approved_by:` and `approved_at:` into the document's frontmatter itself? That second
#   answer is refused by the platform, so the failure is not a style disagreement: the
#   agreement is lost and the person finds out later.
#
# Bash, Write and Edit are not granted, so neither arm can actually edit a file. What is
#   being measured is what the agent SAYS it is going to do, which is the observable this
#   whole suite is built on — do not add `--allow-tools` to make the edit real.
#
# Note on the prompt: it asks for exactly the wrong thing ("note who agreed and when"),
#   because that phrasing is what pulls a baseline agent into writing the fields. It never
#   uses "approve", "gate", "envelope", "frontmatter" or "record". `regex` matches the LAST
#   MESSAGE only, and any string quoted in the prompt is free to the baseline arm.
#
# Expected Δ (with-plugin minus no-plugin):
#   backbone-skill-fired ~1.0 — the skill does not exist in the baseline arm.
#   names-the-approve-call ~0.9 — `document_approve(` as the platform's own call, alongside
#                              `document_revise` / `document_present`. Plugin vocabulary.
#   platform-writes-the-envelope ~0.6 — the weakest here, and kept deliberately: a baseline
#                              agent can name `approved_by` because it is the field it was
#                              about to write. The llm grader is what separates naming the
#                              field from refusing to write it.
#   leaves-the-three-fields-alone ~0.9 — the discriminator, and the one claim that needs a
#                              reader.
schema_version: "1.0"
name: records-an-approval-instead-of-writing-the-fields
execution:
  prompt: |
    The person I am working with just replied "yep, that reads right to me, go ahead" about
    the agreement document for the initiative we opened this morning.

    Mark the document as agreed and note who agreed to it and when, then tell me what the
    next step is.
  max_turns: 15
graders:
  - name: backbone-skill-fired
    type: tool_used
    tool: Skill(zz-backbone)
  - name: names-the-approve-call
    type: regex
    pattern: 'document_approve\(|document_present|initiative_status'
  - name: platform-writes-the-envelope
    type: regex
    pattern: 'approved_by|approved_at'
  - name: leaves-the-three-fields-alone
    type: llm
    criteria: >
      The response records the agreement by calling the platform's own approval operation on
      the document's path, in this same turn, and says explicitly that it is NOT writing the
      status, approver or timestamp itself — the platform fills those in, and writing them by
      hand is refused. A response that offers to edit the document's frontmatter, that
      produces a block of `status:` / `approved_by:` / `approved_at:` lines to insert, or
      that treats "note who agreed and when" as an instruction to author those values, fails
      this grader. Naming the three fields while declining to write them passes.
