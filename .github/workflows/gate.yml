# The repository gate, on every push to master.
#
# Why this exists: nothing ran the gate except a release, so a stale plugin shelf, a check that
# disagrees with live data, or a build that no longer compiles sat on master until somebody cut a
# release — which is when it is most expensive to find. 0.83.1 is the worked example: it deployed,
# failed one doctor probe and could not be rolled back, and the console's gate failed inside a
# release while passing on every manual run.
#
# The gate needs Docker: `checks/schema-inventory.ts` starts a throwaway PostgreSQL from the image
# `deploy/docker-compose.yml` names and migrates it with the real runner, because a static reading
# of the SQL cannot see nullability, foreign-key actions or defaults as PostgreSQL resolves them.
#
# That image is BUILT here from `deploy/postgres/Dockerfile` rather than pulled from ghcr, and the
# tag is written to match what the compose file names so `docker run` finds it locally. Pulling it
# needs a package this repository's GITHUB_TOKEN has no access to — the first run of this workflow
# died on `docker pull` with "Error response from daemon: denied" — and the image is pinned by
# digest and by the extension commit in `deploy/postgres/versions.lock.json`, so building it needs
# no secret at all and proves the Dockerfile still builds.
name: gate

on:
  push:
    branches: [master]
  workflow_dispatch:

# One run per branch, queued rather than cancelled: a push must never go untested, and
# `checks/candidate-build-live.ts` asserts the machine-global candidate build root is exactly as it
# found it — so two runs on one machine each see the other's directory and both fail. The platform's
# own rule is already that gates run serially.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # `-f … .` and not `docker build deploy/postgres`: line 43 of the Dockerfile copies
      # `deploy/postgres/postgresql.conf`, a path relative to the REPO ROOT, so the context is the
      # root and the Dockerfile is the argument. Building with the directory as the context fails
      # with `failed to compute cache key: "/deploy/postgres/postgresql.conf": not found` — which is
      # what the first three runs of this workflow did before anybody read them.
      - name: Build the pinned PostgreSQL the inventory check migrates
        run: docker build -f deploy/postgres/Dockerfile -t ghcr.io/zhixuan312/zz-postgres:17.11-pgts1.4.0 .

      - run: npm ci

      # The three commands the plan's "Full-suite gate" fixes, in its order.
      - name: Typecheck the workspace
        run: npx tsc -b

      - name: Typecheck the tooling project
        run: npx tsc -p tsconfig.tooling.json --noEmit

      - name: The gate
        run: node scripts/gate.ts --quiet
