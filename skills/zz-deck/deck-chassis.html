<!doctype html>
<!--
  == THE HOUSE BOOK =====================================================
  version   1.2.3
  updated   2026-08-15 · refined
  canvas    1440 × 810 · 16:9

  PURPOSE
  One offline file contains four layers:
  1. the professional visual system,
  2. the guidebook that explains when to use each composition,
  3. copyable slide and component markup,
  4. machine-readable metadata and automated quality checks.

  AUTHORING CONTRACT
  - Write the conclusion before selecting a layout.
  - Give every content slide one job and one dominant composition.
  - Use one signal colour per slide; reserve semantic colours for status.
  - Never shrink audience-facing type to solve overflow.
  - Use ?qa or the Menu QA tab before shipping.

  CHANGELOG
  1.2.3  Dead rules removed. Fifty rules whose selectors matched no
         element in the book and no string in its scripts — the
         pre-1.2.0 chart system (chart-*, curve-*, wf-*, stacked-bars,
         mini-bars, waterfall-svg), superseded when every chart was
         rebuilt on cx-*, plus fifteen orphaned component variants.
         Nothing renders differently: a rule that matches nothing
         cannot. Verified by diffing everything after </style>, which
         is byte-identical. No page, component or token added.
  1.2.2  Breathing room, and exhibits that obey their own rules. The
         guide rail begins at one inset on every teaching page instead
         of sixteen. No label sits closer than 24 units to its plate.
         Chart cards fill their row. Three exhibits that contradicted
         the rules printed beside them were corrected. Data marks are
         filled only from data tokens, never from text or hairline
         colours. No page or component added.
  1.2.1  Accent and status separated. The third accent and third chart
         series moved off status-green to a deep teal so the accent
         and status families read apart. Tokens only.
  1.2.0  Chart system unified. Every chart rebuilt as inline SVG on
         two fixed viewBoxes, one palette, annotation collisions
         cleared, reference pages corrected. Added twenty-eight
         component classes and six figures.
  1.1.1  Diagram and chart refinement pass. Tighter type hierarchy,
         calmer diagram styling, cleaner labels, improved callouts.
         Measured against 1.1.0: no page, class or token added.
  1.1.0  Professional rebuild. One coherent style layer, offline
         system fonts, searchable library, agent-readable manifest,
         built-in QA, direct page routing, and eleven new pages
         (forty-two to fifty-three).
  1.0.0  The guidebook. Zone contract (head / stage / foot as grid
         rows), the guide rail on every teaching page, one isolated
         Menu, forty-two pages, and twenty-seven diagram types. This
         is the layout contract the book still honours, so majors
         count from here.

  RENUMBERED 2026-08-15. This file previously ran 2.4.0 to 4.3.0. That
  history bumped minors for releases which added nothing measurable,
  and the file carried four conflicting version strings at once. The
  history above is re-derived from the artifacts, applying the rule
  this book publishes: a minor means a page or component was added, a
  patch means only tokens, copy or behaviour changed.

  PRIOR ART. An earlier component library (readability and elegance
  pass) and a twenty-composition diagram set whose geometry contract
  is adapted from cathrynlavery/diagram-design (MIT). Both predate the
  guidebook and are not releases of this file.
  ======================================================================
-->

.library-search{width:100%;height:38px;padding:0 11px;border:1px solid var(--line-strong);background:var(--paper-2);color:var(--ink);outline:none}.library-search:focus{border-color:var(--accent)}.library-list{display:grid;gap:var(--s1);margin-top:12px}.library-item{appearance:none;display:grid;grid-template-columns:38px 1fr auto;gap:var(--s2);align-items:center;padding:9px 10px;border:1px solid var(--line);background:var(--white);text-align:left;color:var(--ink);cursor:pointer}.library-item:hover{border-color:var(--accent);background:var(--accent-soft)}.library-item b{font-size:var(--fs-small)}.library-item small{font:600 var(--fs-source)/var(--lh-display) var(--mono);color:var(--ink-faint)}.library-item span:first-child{font:650 var(--fs-source)/var(--lh-display) var(--mono);color:var(--ink-faint)}

.slide-notes{display:none}.reveal{animation:fade .38s ease both}@keyframes fade{from{opacity:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media print{
  @page{size:13.333in 7.5in;margin:0}
  html,body{width:auto;height:auto;overflow:visible;background:#fff}
  #viewport{position:static;overflow:visible}
  #stage{position:static;width:13.333in;height:auto;transform:none!important;box-shadow:none}
  .slide{position:relative;width:13.333in;height:7.5in;opacity:1;visibility:visible;pointer-events:auto;page-break-after:always;break-after:page;overflow:hidden}
  /* PRINT THE SCREEN CANVAS, DO NOT RE-LAY-OUT AT A SMALLER ONE.
     On screen every slide is laid out in a fixed 1440x810 box and #stage is
     scaled to the window. 13.333in x 7.5in is 1280x720 css px — 11% narrower
     and 11% shorter — so without this rule print re-flows every line, and any
     slide authored to fill the 810px stage (which the composition rules ask
     for) silently loses whatever no longer fits. It fails quietly: the on-page
     self-check measures the 810px stage and passes, the print PREVIEW looks
     plausible, and the loss only shows up if you read the PDF's text layer.
     Both dimensions share one ratio (1280/1440 = 720/810 = 8/9), so scaling the
     real canvas is exact, and the type stays vector. */
  .slide>.sheet{width:1440px!important;height:810px!important;
                transform:scale(.8888889)!important;transform-origin:top left!important}
  .slide:last-of-type{page-break-after:auto;break-after:auto}
  .dock,.manual,.progress{display:none!important}
  *{box-shadow:none!important}
  .reveal{opacity:1!important;transform:none!important;animation:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ── cx · unified chart vocabulary ─────────────────────────────────────
   Every chart exhibit in the book is inline SVG drawn in one of exactly two
   viewBoxes — 480×300 (card) and 960×380 (wide) — so identical card widths
   yield identical rendered stroke weights and type sizes.                */
.cx-card{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--s2);min-height:0;padding:14px;background:var(--white);border:var(--edge)}
.cx-card .kicker{align-self:start}
.cx-card .small,.cx-card .source,.cx-card .legend{align-self:center;margin:0}
.cx{display:block;width:100%;height:auto;min-height:0;max-height:100%;aspect-ratio:480/300;overflow:visible}
.cx--wide{aspect-ratio:960/380}
.cx text{font-family:var(--sans);fill:var(--ink)}
/* one stroke system */
.cx-axis{fill:none;stroke:var(--line-strong);stroke-width:calc(2px * var(--fscale, 1))}
.cx-grid{fill:none;stroke:var(--grid-ink);stroke-width:calc(1px * var(--fscale, 1))}
.cx-guide{fill:none;stroke:var(--line-strong);stroke-width:calc(1px * var(--fscale, 1));stroke-dasharray:5 4}
.cx-leader{fill:none;stroke:var(--line-strong);stroke-width:calc(1px * var(--fscale, 1))}
.cx-line{fill:none;stroke:var(--accent);stroke-width:calc(3px * var(--fscale, 1));stroke-linecap:round;stroke-linejoin:round}
.cx-point{fill:var(--white);stroke:var(--accent);stroke-width:calc(2px * var(--fscale, 1))}
/* palette discipline — series-4 is the population, accent is the one highlight */
.cx-bar{fill:var(--series-4);stroke:none}
.cx-bar--focus{fill:var(--accent);stroke:none}
.cx-bar--s2{fill:var(--series-2);stroke:none}
.cx-bar--s3{fill:var(--series-3);stroke:none}
.cx-bar--total{fill:var(--ink-soft);stroke:none}
.cx-bar--quiet{fill:var(--series-4);stroke:none}
.cx-track{fill:var(--series-4);fill-opacity:.20;stroke:none}
/* one type ramp — never inline */
text.cx-value{font-family:var(--sans);font-weight:600;font-size:calc(13px * var(--fscale, 1));fill:var(--ink)}
text.cx-cat{font-family:var(--mono);font-weight:600;font-size:calc(11px * var(--fscale, 1));letter-spacing:var(--tr-mono);fill:var(--ink-faint)}
.cx-annot{font-family:var(--mono);font-weight:600;font-size:calc(11px * var(--fscale, 1));fill:var(--ink)}
.cx-axis-title{font-family:var(--mono);font-weight:600;font-size:calc(10px * var(--fscale, 1));letter-spacing:var(--tr-mono);fill:var(--ink-faint)}
.cx-big{font-family:var(--sans);font-weight:700;font-size:calc(26px * var(--fscale, 1));fill:var(--ink);letter-spacing:var(--tr-snug)}
text.cx-seg{font-family:var(--sans);font-weight:600;font-size:calc(13px * var(--fscale, 1));fill:var(--white)}
.cx-seg--dark{fill:var(--ink)}
.cx-plate{fill:var(--white);stroke:var(--line-strong);stroke-width:calc(1px * var(--fscale, 1))}
/* legend lives in HTML below the svg, never inside it */
.cx-legend i{background:var(--series-4)}
.cx-legend li:nth-child(2) i{background:var(--series-2)}
.cx-legend li:nth-child(3) i{background:var(--series-3)}
/* per-exhibit hosts */
[data-slide-id="charts-categorical"] .chart-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:var(--s3);flex:1 1 auto;min-height:0}
[data-slide-id="waterfall-and-composition"] .two-chart-stage{align-items:stretch}
[data-slide-id="waterfall-and-composition"] .cx-card>.cx,
[data-slide-id="charts-trend"] .cx-card>.cx,
[data-slide-id="evidence-stage"] .cx-card>.cx{height:100%;max-height:100%}
[data-slide-id="visual-hierarchy"] .hierarchy-board__proof .cx{max-height:none}
[data-slide-id="canvas-and-travel"] .guide__sample>div{padding-bottom:var(--s6)}
[data-slide-id="acceptance-gates"] .list--check{gap:var(--s6);margin-top:var(--s4)}
[data-slide-id="evidence-stage"] .evidence-stage__visual{background:var(--white);padding:18px;align-items:stretch}
[data-slide-id="evidence-stage"] .evidence-stage__visual>div{height:100%;display:flex;flex-direction:column}
[data-slide-id="evidence-stage"] .evidence-stage__visual .cx-card{flex:1 1 auto;min-height:0}
.cx-legend{display:flex;gap:var(--s6);align-items:center;justify-content:center;margin:var(--s3) 0 0;font-family:var(--mono);font-size:var(--fs-source);letter-spacing:var(--tr-mono);text-transform:uppercase;color:var(--ink-faint)}.cx-legend span{display:inline-flex;align-items:center;gap:var(--s1)}.cx-key{width:18px;height:0;border-top:2px solid var(--accent);display:inline-block}.cx-key--dashed{border-top:2px dashed var(--line-strong)}.cx-plate{fill:var(--white);stroke:var(--line-strong);stroke-width:calc(1px * var(--fscale, 1))}
/* ======================================================================
   LAYOUT CONSISTENCY PASS · A · stage fill
   .zone-stage and .guide__sample are centred flex columns, so a short
   exhibit would float in a tall row. The primary exhibit consumes
   the row; captions, callouts, sources and legends keep natural height.
   Anything that still cannot stretch stays optically centred, because
   justify-content:center is preserved on both zones.
   ====================================================================== */
.zone-stage>*,
.guide__sample>*{flex:0 0 auto;min-height:0}
.zone-stage>:not(p):not(.callout):not(.source):not(.legend):not(.band-stack):not(.pyramid):not(.nest):not(.hierarchy-board):not(.router-grid):not(.diagram-router):not(.chart-router):not(.grid):not(.matrix):not(.method-row):not(.structure-demos):not(.changelog):not(.story-arc):not(.architecture-map):not(.flow):not(.timeline),
.guide__sample>:not(p):not(.callout):not(.source):not(.legend):not(.band-stack):not(.pyramid):not(.nest):not(.hierarchy-board):not(.router-grid):not(.diagram-router):not(.chart-router):not(.grid):not(.matrix):not(.method-row):not(.structure-demos):not(.changelog):not(.story-arc):not(.architecture-map):not(.flow):not(.timeline){flex:1 1 auto;min-height:0}

/* tables become the exhibit: extra height is distributed across the rows */
.zone-stage>table,
.guide__sample>table{height:100%}

/* chart pages and the pinned mock keep their current exhibit sizing */
[data-slide-id="charts-categorical"] .guide__sample>*,
[data-slide-id="charts-trend"] .guide__sample>*,
[data-slide-id="waterfall-and-composition"] .guide__sample>*,
[data-slide-id="annotated-image"] .guide__sample>*{flex:0 1 auto}

/* --- exhibits that need their own children to take up the new height --- */
.zone-stage .band-stack>.band{flex:0 0 auto;min-height:var(--s10)}
.zone-stage .pyramid__tier{flex:0 0 auto;height:auto;min-height:var(--s10)}
.zone-stage .roadmap__axis{flex:0 0 auto}
.zone-stage .roadmap__row{flex:1 1 auto}
.zone-stage .changelog{justify-content:space-between}
.zone-stage .specimen{justify-content:space-between}
.zone-stage .space-scale{justify-content:space-between}
.zone-stage .story-arc{align-items:stretch;align-content:center}
.zone-stage .story-arc>i{align-self:center}
.zone-stage .wire__stage{align-content:center}
[data-slide-id="colour"] .guide__sample>div{display:flex;flex-direction:column}
[data-slide-id="colour"] .swatch-row{flex:1 1 auto;min-height:0}
/* end pass A */

/* ======================================================================
   LAYOUT CONSISTENCY PASS · B · uniform card rows
   Grid items sized to content, so a row of cards rendered ragged and one
   card could sit vertically offset from its peers. Every peer row now
   stretches and every card is a full-height flex column, so short content
   is absorbed by the card's internal spacing instead of shrinking the card.
   ====================================================================== */
.zone-stage .grid,
.zone-stage .method-row,
.zone-stage .structure-demos,
.zone-stage .router-grid,
.zone-stage .diagram-router,
.zone-stage .chart-router,
.zone-stage .hierarchy-board,
.zone-stage .risk-layout,
.zone-stage .exec-summary__proofs{align-items:stretch;align-content:center}
.zone-stage .decision-close__actions{align-items:stretch;align-content:stretch}

.zone-stage .grid>.card,
.zone-stage .method-row>.card,
.zone-stage .structure-demos>.card,
.zone-stage .risk-layout>.risk-card{height:100%;display:flex;flex-direction:column}
.zone-stage .grid>.card{justify-content:center}
.zone-stage .grid:has(>.card~.card)>.card{justify-content:flex-start}
/* inline-level metadata must not stretch to the full card width */
.zone-stage .card>.badge,
.zone-stage .card>.pill,
.zone-stage .callout>.badge{align-self:flex-start}

/* routers: the tile fills its track, its copy stays optically centred */
.zone-stage .route-row{align-content:center}
.zone-stage .route-card{height:100%;justify-content:center}

/* visual hierarchy: three peer cards, top-aligned and equal height.
   Each card keeps its numbered kicker on the top line; the proof card's
   exhibit sits on the card's baseline instead of floating mid-card. */
.zone-stage .hierarchy-board>div{align-self:stretch;height:100%}
.zone-stage .hierarchy-board__proof{justify-content:flex-start}
.zone-stage .hierarchy-board__proof .mini-bars{margin-top:auto}
.zone-stage .hierarchy-board__context{align-self:stretch}

/* callouts and voice: four asides read as one uniform block */
[data-slide-id="callouts-and-voice"] .grid--2>div{height:100%}
[data-slide-id="callouts-and-voice"] .grid--2>div>.callout{flex:1 1 0;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:var(--s2)}
/* end pass B */

/* ======================================================================
   LAYOUT CONSISTENCY PASS · C · nested rings
   The label row and the ring row both stretched, which pushed each label
   far from the boundary it names and hollowed out the middle. The label
   row is now auto and the ring row takes the rest, with tighter padding,
   so the three rings read as snug concentric boundaries filling the stage.
   ====================================================================== */
.zone-stage .nest,
.zone-stage .nest__ring{grid-template-rows:auto auto;padding:var(--s4)}
.zone-stage .nest__label{margin:0 0 var(--s2)}
.zone-stage .nest__core{align-self:center;justify-self:center;height:auto;min-height:0;padding:var(--s9) var(--s10)}
/* end pass C */
/* ======================================================================
   BALANCE PASS · D · text-bearing compositions size to content
   Companion to the narrowed selector in pass A above. Two kinds of stage
   content, two behaviours:

     scalable exhibit (.cx / .dgm / a mock frame)  -> flex:1 1 auto, fills
     text-bearing composition (stacks and grids)   -> flex:0 0 auto, centred

   Centring is the stage's own justify-content:center doing its job once
   the composition stops growing — the leftover splits evenly above and
   below instead of pooling at the bottom. Sibling equalisation is
   unchanged: align-items:stretch from pass B still gives every card in a
   row the tallest sibling's natural height, and cards stay flex columns
   so their internal spacing distributes.

   The rules below are the follow-through: component minimums that were
   tuned for a stretched box and now read as padding around nothing.
   ====================================================================== */

/* the nest is a composition, not an exhibit: content height, then centred */
.zone-stage .nest{flex:0 0 auto}

/* router tiles: min-height:142px was carrying a stretched card. A kicker,
   a title and one line of question is ~82px of content; the token padding
   below lands the tile near 1.4x its content instead of 1.7x. */
.zone-stage .route-card{min-height:calc(var(--s9) + var(--s9));padding:var(--s6) var(--s5)}
.zone-stage .route-row{min-height:calc(var(--s10) + var(--s6))}

/* coverage matrix: cells do not inherit the stage's spare height, so the
   floor moves up one step to keep the grid from reading cramped */
.zone-stage .matrix__cell{min-height:var(--s9)}
.zone-stage .matrix__cell--head{min-height:var(--s8)}

/* visual hierarchy: three peers, one height, top-aligned — that part was
   right. The board itself now sizes to the tallest card (the proof card,
   whose chart keeps its aspect ratio) and centres in the stage. */
.zone-stage .hierarchy-board__context{min-height:0}

/* callouts and voice: the four asides still read as one uniform block, but
   flex-basis:0 contributed nothing to the column's intrinsic height once
   the grid stopped being stretched by the stage, which clipped the copy.
   Basis auto restores the contribution; grow still equalises the pair. */
[data-slide-id="callouts-and-voice"] .zone-stage .grid--2>div>.callout{flex:1 1 auto}
/* end pass D */
</style>
</head>
<body>
<div id="viewport">
<main id="stage">
<i class="progress" id="progressBar" aria-hidden="true"></i>





















































<div class="dock" aria-label="Presentation controls">
  <button id="prevBtn" type="button" aria-label="Previous slide">‹</button>
  <span class="dock__counter" id="counter">01 / 53</span>
  <button id="nextBtn" type="button" aria-label="Next slide">›</button>
  <button id="menuBtn" type="button">Menu · M</button>
  <button id="presentBtn" type="button">Present · P</button>
</div>
<aside class="manual" id="manual" aria-label="Guidebook menu">
  <div class="manual__head">
    <p class="manual__title">The House Book</p>
    <button id="manualPrev" class="manual__close" type="button" aria-label="Previous slide" onclick="document.getElementById('prevBtn').click()">‹</button>
    <button id="manualNext" class="manual__close" type="button" aria-label="Next slide" onclick="document.getElementById('nextBtn').click()">›</button>
    <button id="manualClose" class="manual__close" type="button" aria-label="Close menu">×</button>
  </div>
  <div class="manual__tabs" role="tablist">
    <button class="manual__tab active" data-tab="library" type="button">Library</button>
    <button class="manual__tab" data-tab="guide" type="button">Guide</button>
    <button class="manual__tab" data-tab="notes" type="button">Notes</button>
    <button class="manual__tab" data-tab="code" type="button">Code</button>
    <button class="manual__tab" data-tab="qa" type="button">QA</button>
    <button class="manual__tab" data-tab="version" type="button">Version</button>
  </div>
  <div class="manual__body" id="manualBody"></div>
</aside>

</main>
</div>
<script>
const stage = document.getElementById('stage');
const slides = [...document.querySelectorAll('.slide')];
const progressBar = document.getElementById('progressBar');
const counter = document.getElementById('counter');
const manual = document.getElementById('manual');
const manualBody = document.getElementById('manualBody');
const tabs = [...document.querySelectorAll('.manual__tab')];
let current = 0;
let activeTab = 'library';
let startX = 0;

function fitStage(){
  const scale = Math.min(innerWidth / 1440, innerHeight / 810) * .985;
  stage.style.transform = `translate(-50%,-50%) scale(${scale})`;
}
function pad(n){return String(n).padStart(2,'0')}
function fillFeet(){
  const total = pad(slides.length);
  slides.forEach((slide,i)=>{
    const foot=slide.querySelector('.zone-foot'); if(!foot) return;
    const left=document.createElement('span');
    const right=document.createElement('span');
    left.textContent=slide.dataset.chapter||'The House Book';
    right.textContent=`${pad(i+1)} · ${total}`;
    foot.replaceChildren(left,right);
  });
}
function resolveIndex(index){return (index + slides.length) % slides.length}
function show(index,{updateHash=true}={}){
  current=resolveIndex(index);
  slides.forEach((slide,i)=>slide.classList.toggle('active',i===current));
  progressBar.style.width=`${((current+1)/slides.length)*100}%`;
  counter.textContent=`${pad(current+1)} / ${pad(slides.length)}`;
  document.title=`${slides[current].getAttribute('aria-label')} · The House Book`;
  if(updateHash) history.replaceState(null,'',`#${slides[current].dataset.slideId}`);
  fitStage();
  if(manual.classList.contains('open')) selectTab(activeTab);
}
function findSlide(target){
  return slides.findIndex(s=>s.getAttribute('aria-label')===target || s.dataset.slideId===target);
}
function jump(target){const i=findSlide(target); if(i>=0){show(i); closeManual();}}
function openManual(tab=activeTab){manual.classList.add('open');selectTab(tab)}
function closeManual(){manual.classList.remove('open')}
function toggleManual(){manual.classList.contains('open')?closeManual():openManual()}
function escapeHTML(value){return value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
async function copyText(value,button){
  const legacy=()=>{const area=document.createElement('textarea');area.value=value;area.setAttribute('readonly','');area.style.position='fixed';area.style.left='-9999px';document.body.append(area);area.select();document.execCommand('copy');area.remove()};
  try{if(navigator.clipboard?.writeText) await navigator.clipboard.writeText(value); else legacy();button.textContent='Copied';setTimeout(()=>button.textContent=button.dataset.label||'Copy',1000)}catch{legacy()}
}
function cleanSlideMarkup(slide){
  const clone=slide.cloneNode(true);clone.classList.remove('active');
  const foot=clone.querySelector('.zone-foot');if(foot)foot.replaceChildren();
  return clone.outerHTML;
}
function renderLibrary(){
  manualBody.innerHTML=`<input class="library-search" id="librarySearch" type="search" placeholder="Search job, component, or keyword…" aria-label="Search library"><div class="library-list" id="libraryList"></div>`;
  const input=document.getElementById('librarySearch'); const list=document.getElementById('libraryList');
  function paint(){
    const q=input.value.trim().toLowerCase();list.replaceChildren();
    slides.forEach((s,i)=>{
      const hay=[s.getAttribute('aria-label'),s.dataset.chapter,s.dataset.job,s.dataset.use,s.dataset.tags].join(' ').toLowerCase();
      if(q&&!hay.includes(q))return;
      const b=document.createElement('button');b.className='library-item';b.type='button';
      b.innerHTML=`<span>${pad(i+1)}</span><b>${escapeHTML(s.getAttribute('aria-label')||'Page')}</b><small>${escapeHTML(s.dataset.job||'')}</small>`;
      b.onclick=()=>{show(i);selectTab('guide')};list.append(b);
    });
  }
  input.addEventListener('input',paint);paint();setTimeout(()=>input.focus(),0);
}
function renderGuide(){
  const s=slides[current];
  manualBody.innerHTML=`<h4>${escapeHTML(s.getAttribute('aria-label')||'Page')}</h4><div class="guide-card"><div class="is-focus"><b>Job</b><p>${escapeHTML(s.dataset.job||'')}</p></div><div><b>Use when</b><p>${escapeHTML(s.dataset.use||'Not specified')}</p></div><div><b>Choose this over</b><p>${escapeHTML(s.dataset.choose||'Not specified')}</p></div><div><b>Limits</b><p>${escapeHTML(s.dataset.limits||'Not specified')}</p></div><div><b>Source mode</b><p>${s.dataset.sourceRequired==='true'?'External evidence requires a visible source.':'Illustrative reference page. Set data-source-required=\"true\" when copied content uses external evidence.'}</p></div><div><b>Agent tags</b><p class="mono">${escapeHTML(s.dataset.tags||'')}</p></div></div>`;
}
function renderNotes(){
  const notes=slides[current].querySelector('.slide-notes');
  manualBody.innerHTML=`<h4>Speaker notes</h4>${notes?notes.innerHTML:'<p>No notes on this page. Add a hidden <code>&lt;aside class="slide-notes"&gt;</code> inside the slide.</p>'}`;
}
function renderCode(){
  const slide=slides[current];const stageMarkup=slide.querySelector('.zone-stage')?.innerHTML.trim()||'';const full=cleanSlideMarkup(slide);
  manualBody.innerHTML='<div class="copy-row"></div><pre></pre>';
  const row=manualBody.querySelector('.copy-row'); const pre=manualBody.querySelector('pre');pre.textContent=full;
  [['Copy slide',full],['Copy composition',stageMarkup],['Show composition',stageMarkup],['Show full slide',full]].forEach(([label,value],i)=>{
    const b=document.createElement('button');b.className='mini-button';b.type='button';b.textContent=label;b.dataset.label=label;
    if(i<2)b.onclick=()=>copyText(value,b);else b.onclick=()=>pre.textContent=value;row.append(b);
  });
}
function textPx(el){return parseFloat(getComputedStyle(el).fontSize||'0')}
function runChecks(slide){
  slide.classList.remove('qa-mark');slide.querySelectorAll('.qa-mark').forEach(x=>x.classList.remove('qa-mark'));
  const checks=[];const add=(status,name,detail,target)=>checks.push({status,name,detail,target});
  const zone=slide.querySelector('.zone-stage');
  if(zone){const overflow=zone.scrollHeight>zone.clientHeight+1||zone.scrollWidth>zone.clientWidth+1;add(overflow?'fail':'pass','Safe-area overflow',overflow?'Content exceeds the stage. Shorten, split, or change composition.':'Content fits inside the stage.',overflow?zone:null)}
  const comps=zone?[...zone.children].filter(x=>!x.matches('.source,.callout,.mono,.footnote')).length:0;
  add(comps<=1?'pass':'warn','One dominant composition',comps<=1?'The stage has one primary composition.':`${comps} top-level objects are present. Confirm that only one carries the argument.`,comps>1?zone:null);
  const body=[...slide.querySelectorAll('.zone-stage p,.zone-stage li,.zone-stage td')].filter(x=>!x.closest('.guide__rail,.mock-app,.zone-foot,.dock,.manual')&&!x.matches('.source,.kicker,.badge,.card__label,.stat__label,.rail-label,.mono,.specimen__meta,.wire__tag,.wire__note,.swatch-caption,.timeline__date,.band__label,.nest__label,.quadrant-axis,.legend li'));
  const small=body.filter(x=>textPx(x)<13.4).length;add(small===0?'pass':'warn','Reading floor',small===0?'Audience-facing body text stays at or above the reference floor.':`${small} audience-facing body text nodes are below the reference floor.`,small?body.find(x=>textPx(x)<13.4):null);
  const svgs=[...slide.querySelectorAll('svg')];const badA11y=svgs.filter(svg=>!svg.getAttribute('role')||!svg.querySelector('title')||!svg.querySelector('desc'));
  add(badA11y.length===0?'pass':'fail','Figure accessibility',badA11y.length===0?'Every SVG has role, title, and description.':`${badA11y.length} SVG figure(s) lack role, title, or description.`,badA11y[0]);
  const title=slide.querySelector('.zone-head h2,h1');const titleText=title?.textContent.trim()||'';
  add(titleText.length<=88?'pass':'warn','Title length',titleText.length<=88?`${titleText.length} characters.`:`${titleText.length} characters. Shorten for one-glance reading.`,titleText.length>88?title:null);
  const missing=['job','use','choose','limits','tags'].filter(k=>!slide.dataset[k]);
  add(missing.length===0?'pass':'fail','Agent metadata',missing.length===0?'Job, use, choice, limits, and tags are present.':`Missing: ${missing.join(', ')}.`,missing.length?slide:null);
  const sources=slide.querySelectorAll('.source').length;const evidence=slide.querySelectorAll('table,.cx-card,.chart,.dgm,.evidence-stage__visual,.figure-card').length;const sourceRequired=slide.dataset.sourceRequired==='true';
  add(!sourceRequired||evidence===0||sources>0?'pass':'warn','Source treatment',!sourceRequired?'Illustrative reference page; external sourcing is not enabled.':evidence===0?'No external evidence object detected.':'Evidence is present but no source line is visible.',sourceRequired&&evidence&&sources===0?zone:null);
  // `.cx-card` is in the evidence selector because 1.2.0 rebuilt every chart on it and
  // nobody updated this line. Nine pages here carry a cx chart, and the selector still
  // named `.curve-card`, the card it replaced — so on an authored deck that sets
  // data-source-required="true", a slide whose only evidence is a chart counted ZERO
  // evidence objects and Source treatment passed as "No external evidence object
  // detected". A check that passes because it cannot see the thing it is checking.
  // The guidebook never caught it: no page here sets data-source-required="true", so
  // the branch was never taken in the one deck anybody runs the QA on.
  // Figure geometry. The safe-area check above measures container scroll, but
  // .cx and .dgm are overflow:visible SVG - text can sit outside its viewBox,
  // overlap a neighbour, or run past the shape it labels and nothing scrolls.
  // Every one of those reads as a broken figure and none of them is a scroll.
  const figs=[...slide.querySelectorAll('svg[viewBox]')];
  const oob=[],hits=[],spills=[];
  figs.forEach(svg=>{
    const vb=svg.getAttribute('viewBox').split(/[\s,]+/).map(Number);
    const boxes=[];
    svg.querySelectorAll('text').forEach(t=>{
      if(!t.textContent.trim())return;
      let b;try{b=t.getBBox()}catch(e){return}
      if(!b.width&&!b.height)return;
      boxes.push({t,b});
      if(b.x<vb[0]-1||b.y<vb[1]-1||b.x+b.width>vb[0]+vb[2]+1||b.y+b.height>vb[1]+vb[3]+1) oob.push(t);
    });
    for(let a=0;a<boxes.length;a++)for(let c=a+1;c<boxes.length;c++){
      const A=boxes[a].b,B=boxes[c].b;
      if(Math.min(A.x+A.width,B.x+B.width)-Math.max(A.x,B.x)>1.5&&
         Math.min(A.y+A.height,B.y+B.height)-Math.max(A.y,B.y)>1.5) hits.push(boxes[a].t);
    }
    const rects=[...svg.querySelectorAll('rect')].map(r=>({
      x:+r.getAttribute('x')||0,y:+r.getAttribute('y')||0,
      w:+r.getAttribute('width')||0,h:+r.getAttribute('height')||0})).filter(o=>o.w&&o.h);
    boxes.forEach(({t,b})=>{
      const cx=b.x+b.width/2,cy=b.y+b.height/2;
      const host=rects.filter(o=>cx>=o.x&&cx<=o.x+o.w&&cy>=o.y&&cy<=o.y+o.h)
                      .sort((m,n)=>m.w*m.h-n.w*n.h)[0];
      if(host&&(b.x<host.x-1||b.x+b.width>host.x+host.w+1)) spills.push(t);
    });
  });
  const figBad=oob.length+hits.length+spills.length;
  add(figBad===0?'pass':'fail','Figure text fits',
    figBad===0?(figs.length?`Text in ${figs.length} figure(s) sits inside its viewBox, its shape, and clear of its neighbours.`:'No figures on this slide.')
      :[oob.length&&`${oob.length} label(s) outside the viewBox`,hits.length&&`${hits.length} overlapping label pair(s)`,spills.length&&`${spills.length} label(s) wider than the shape they sit in`].filter(Boolean).join('; ')+'.',
    oob[0]||hits[0]||spills[0]||null);

  // Contrast. Composite the whole ancestor stack - stopping at the first
  // non-transparent background reads a 2%-tint zebra row as opaque and scores
  // near-black text on near-white paper at 1.00:1.
  const lum=c=>{const m=c.match(/[\d.]+/g);if(!m)return null;
    const a=m.slice(0,3).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
    return .2126*a[0]+.7152*a[1]+.0722*a[2]};
  const ground=el=>{const L=[];let n=el;
    while(n&&n!==document.documentElement){const m=(getComputedStyle(n).backgroundColor||'').match(/[\d.]+/g);
      if(m){const a=m.length>3?parseFloat(m[3]):1;if(a>.001)L.push([+m[0],+m[1],+m[2],a])}
      n=n.parentElement}
    if(!L.length)return null;
    let acc=L[L.length-1].slice(0,3);
    for(let k=L.length-2;k>=0;k--){const[r,g,b,a]=L[k];acc=[r*a+acc[0]*(1-a),g*a+acc[1]*(1-a),b*a+acc[2]*(1-a)]}
    return 'rgb('+acc.map(Math.round).join(', ')+')'};
  const dim=[];
  slide.querySelectorAll('.zone-head p,.zone-head h2,.zone-stage p,.zone-stage li,.zone-stage td,.zone-stage th,.zone-stage span,.zone-stage strong').forEach(el=>{
    if(el.children.length||!el.textContent.trim())return;
    if(!el.getBoundingClientRect().height)return;
    const cs=getComputedStyle(el),bg=ground(el);if(!bg)return;
    const f=lum(cs.color),b=lum(bg);if(f===null||b===null)return;
    const cr=(Math.max(f,b)+.05)/(Math.min(f,b)+.05);
    const px=parseFloat(cs.fontSize),need=(px>=24||(px>=18.66&&parseInt(cs.fontWeight)>=600))?3:4.5;
    if(cr<need-.02) dim.push({el,cr,need});
  });
  add(dim.length===0?'pass':'fail','Text contrast',
    dim.length===0?'Every text node clears WCAG AA against its composited background.'
      :`${dim.length} node(s) below AA — lowest ${dim.reduce((m,d)=>Math.min(m,d.cr),99).toFixed(2)}:1 on "${dim[0].el.textContent.trim().slice(0,40)}".`,
    dim[0]?dim[0].el:null);

  return checks;
}
function renderQA(){
  const checks=runChecks(slides[current]);const failures=checks.filter(x=>x.status==='fail').length;const warnings=checks.filter(x=>x.status==='warn').length;
  manualBody.innerHTML=`<div class="qa-summary"><b>${failures?'Needs revision':warnings?'Review warnings':'All checks pass'}</b><span>${failures} fail · ${warnings} warn</span></div><div class="qa-list"></div>`;
  const list=manualBody.querySelector('.qa-list');checks.forEach(c=>{const item=document.createElement('div');item.className=`qa-item ${c.status}`;item.innerHTML=`<i>${c.status==='pass'?'✓':c.status==='warn'?'!':'×'}</i><div><b>${escapeHTML(c.name)}</b><p>${escapeHTML(c.detail)}</p></div>`;if(c.target)item.onclick=()=>{c.target.classList.add('qa-mark');setTimeout(()=>c.target.classList.remove('qa-mark'),1700)};list.append(item)});
  const all=document.createElement('button');all.className='mini-button';all.style.marginTop='12px';all.textContent='Run whole deck';all.onclick=renderDeckQA;manualBody.append(all);
}
function renderDeckQA(){
  const result=slides.map((s,i)=>({i,checks:runChecks(s)}));const pages=result.filter(r=>r.checks.some(c=>c.status!=='pass'));
  manualBody.innerHTML=`<div class="qa-summary"><b>${pages.length?'Deck review':'Whole deck passes'}</b><span>${pages.length} page(s) with warnings or failures</span></div><div class="library-list"></div>`;
  const list=manualBody.querySelector('.library-list');if(!pages.length){list.innerHTML='<p>Every automated check passed.</p>';return}
  pages.forEach(r=>{const s=slides[r.i];const f=r.checks.filter(c=>c.status==='fail').length;const w=r.checks.filter(c=>c.status==='warn').length;const b=document.createElement('button');b.className='library-item';b.innerHTML=`<span>${pad(r.i+1)}</span><b>${escapeHTML(s.getAttribute('aria-label'))}</b><small>${f} fail · ${w} warn</small>`;b.onclick=()=>{show(r.i);selectTab('qa')};list.append(b)});
}
function renderVersion(){
  const manifest=JSON.parse(document.getElementById('housebook-manifest').textContent);
  manualBody.innerHTML=`<h4>Version ${manifest.version}</h4><p>${escapeHTML(manifest.summary)}</p><h4>Contract</h4><ul><li>Single offline HTML file</li><li>Fixed 1440 × 810 canvas</li><li>Stable slide IDs and machine-readable metadata</li><li>Searchable library and copyable compositions</li><li>Current-page and deck QA</li></ul><h4>Pages</h4><p>${manifest.slides.length} reference pages across ${new Set(manifest.slides.map(s=>s.chapter)).size} chapter labels.</p>`;
}
function selectTab(name){
  activeTab=name;tabs.forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  ({library:renderLibrary,guide:renderGuide,notes:renderNotes,code:renderCode,qa:renderQA,version:renderVersion}[name]||renderGuide)();
}
function present(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}

document.getElementById('prevBtn').onclick=()=>show(current-1);
document.getElementById('nextBtn').onclick=()=>show(current+1);
document.getElementById('menuBtn').onclick=()=>openManual('library');
document.getElementById('presentBtn').onclick=present;
document.getElementById('manualClose').onclick=closeManual;
tabs.forEach(t=>t.onclick=()=>selectTab(t.dataset.tab));
document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>jump(b.dataset.jump));
addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();if(['input','textarea'].includes(tag))return;
  if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();show(current+1)}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}
  if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);
  if(e.key.toLowerCase()==='m')toggleManual();if(e.key.toLowerCase()==='p')present();
  if(e.key==='/'){e.preventDefault();openManual('library')}
  if(e.key==='Escape')closeManual();
});
stage.addEventListener('touchstart',e=>startX=e.changedTouches[0].screenX);
stage.addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-startX;if(Math.abs(d)>=55)show(current+(d<0?1:-1))});
addEventListener('resize',fitStage);addEventListener('fullscreenchange',fitStage);
fillFeet();
const hash=decodeURIComponent(location.hash.slice(1));const start=findSlide(hash);show(start>=0?start:0,{updateHash:start<0});
if(new URLSearchParams(location.search).has('qa')){openManual('qa')}
</script>
