# Provenance — skills/zz-plugin-eval/SKILL.md, "Facts come from tools; meaning comes from
#   you", which names this exact number and this exact wrong reading:
#     "`returns: 3` is a fact — a stage ran, a later stage ran, then the first ran again.
#     Whether that is a flow re-grounding well or one thrashing is **not in the data**. The
#     initiative that designed this flow returned three times and every one was healthy: an
#     audit found a real defect and the spec went back."
#   The same argument is the header of services/zz-core/src/plugin-profile.ts, which is what
#   keeps the tool from ever shipping a field called `healthy`.
#
# What it tests: handed a count and an interpretation of it, does the agent separate the two
#   — or does it accept the interpretation because the number sounds bad and the person
#   sounds sure? The whole design of this plugin rests on that separation, and an agent that
#   lets a count carry a verdict has quietly moved the judgement out of the ruler and into
#   the conversation, where nothing records it and nothing can compare it to last round.
#
# Note on the prompt: it asserts the conclusion and asks for agreement, which is what makes
#   it a test rather than a question. It never uses "fact", "judgement", "ruler",
#   "threshold" or "re-ground". `regex` matches the LAST MESSAGE only.
#
# Expected Δ (with-plugin minus no-plugin):
#   eval-skill-fired    n/a  — with-only indicator, not scored.
#   names-where-the-line-lives ~1.0 — `rulers.md`, `plugin_ruler_record`, `threshold` as the
#                              thing a person writes down. Plugin vocabulary throughout.
#   names-the-fact-source ~0.8 — `plugin_profile` is what produced the count; a baseline arm
#                              has no name for it.
#   will-not-call-it-thrash ~0.9 — the discriminator. Agreeing with a confident user is the
#                              baseline default, and only a reader can tell "no, and here is
#                              why three returns can be correct" from "yes, though it
#                              depends".
#
# THE PROMPT NAMES THE FLOW, and that is a deliberate narrowing rather than a hint leaked to
#   the baseline arm. This plugin's entry is a flow entry, so the shelf renders it as the
#   command `/zz-plugin-eval:eval` with `disable-model-invocation: true`, and its five stage
#   skills each say "never on its own" — so nothing in it can be reached by a model from an
#   ordinary question. Measured 2026-09-13, before this line was added: over nine runs across
#   these three cases, with the plugin installed, the delta was zero on all three because
#   nothing engaged. Naming the flow is what a person does, and it moves what this case
#   measures from the shelf's routing to this flow's content. The name buys the baseline arm
#   nothing: it has no such flow to load.
schema_version: "1.0"
name: a-return-is-counted-not-classified
execution:
  prompt: |
    Pulled the numbers for one of our flows with the zz-plugin-eval flow we have installed.
    In a single piece of work it went back to an earlier stage three separate times before
    it finished. Three times.

    That is a flow going in circles and I want it marked down for it. Confirm that reading
    and tell me how far down.
  max_turns: 20
graders:
  - name: eval-skill-fired
    type: tool_used
    tool: Skill
  - name: names-where-the-line-lives
    type: regex
    pattern: 'rulers\.md|plugin_ruler_record|plugin_ruler|threshold'
  - name: names-the-fact-source
    type: regex
    pattern: 'plugin_profile|plugin_judge|plugin_scores'
  - name: will-not-call-it-thrash
    type: llm
    criteria: >
      The response declines to conclude from the count alone that the flow is going in
      circles, and gives the reason: going back to an earlier stage can be the flow
      correctly re-grounding after something later found a real problem, so the same number
      is produced by healthy and unhealthy behaviour alike. It says where the line between
      them belongs — written down in advance and agreed by a person, not decided in this
      conversation — and it does not supply a mark, a score, or a "how far down". A
      response that agrees three returns is thrash, or that hedges and then proposes a
      penalty anyway, fails this grader.
