# The repository gate, on every push to master, so a stale plugin shelf, a check that disagrees
# with live data or a build that no longer compiles is found on the push rather than in a release.
#
# Constraints the steps below follow:
#
#  1. The console is checked out as a SIBLING. The check "every route this gateway serves has a
#     caller" reads the console's API calls and refuses to pass when the console is absent. Both
#     repositories are checked out under `pair/`, and every step runs from `pair/zz-stack`, so
#     `../zz-stack-dashboard` resolves exactly as it does in a developer's checkout.
#  2. Two overlapping runs fail each other: `checks/candidate-build-live.ts` asserts the
#     machine-global candidate build root is as it found it. Hence `concurrency` below.
name: gate

on:
  push:
    branches: [master]
  workflow_dispatch:

# Both checkouts are public and nothing is published, so the token reads and nothing more.
permissions:
  contents: read

# One run per branch, queued rather than cancelled: a push must never go untested.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Every step runs as if from a developer's checkout, one directory below the console's.
    defaults:
      run:
        working-directory: pair/zz-stack
    steps:
      - uses: actions/checkout@v4
        with:
          path: pair/zz-stack
          # The tags too: "the version that shipped has a changelog section of its own" asks git
          # whether this version is tagged, and a checkout without tags answers "not yet released".
          # Full depth, because `fetch-tags` on the default one-commit clone fetches none.
          fetch-depth: 0
          fetch-tags: true

      # Both repositories are public, so the default token reads the console without a secret.
      - uses: actions/checkout@v4
        with:
          repository: zhixuan312/zz-stack-dashboard
          path: pair/zz-stack-dashboard

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # The three commands the plan's "Full-suite gate" fixes, in its order.
      - name: Typecheck the workspace
        run: npx tsc -b

      # The document panel zz-core serves: bundled after the typecheck, as `npm run build` does,
      # so the checks that read dist/apps/document-panel.html read the page the image ships.
      - name: Build the document panel
        run: node services/zz-core/app/build.ts

      - name: Typecheck the tooling project
        run: npx tsc -p tsconfig.tooling.json --noEmit

      - name: The gate
        run: node scripts/gate.ts --quiet
