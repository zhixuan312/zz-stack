# Provenance — skills/zz-platform, restated in sdlc-spec/SKILL.md:249 in its own words:
#   "A spec written to a local path is a file on your disk: no envelope, no version
#   snapshot at approval, no telemetry, and nothing the person can approve or the auditor
#   can read. It also looks exactly like success."
#   That last sentence is why this needs an eval rather than a code path: writing to the
#   wrong place produces no error, so nothing but a measurement ever notices.
#   sdlc-explore/SKILL.md:80 and sdlc-method/SKILL.md:161 carry the same rule.
#
# What it tests: asked to write an initiative's document, does the agent reach for the
#   platform's `document_write` and a store-relative path, rather than its runtime's local
#   Write tool?
#
# IMPORTANT — no MCP server runs in this eval. The sdlc plugin ships no `.mcp.json`, and
#   under the default `--mocks record` a server with no mock is not started, so
#   `mcp__plugin_zz_zz-core__write_file` is not callable in either arm. The observable is
#   therefore what the agent SAYS it is doing, not a tool call. Do not "fix" this with a
#   `tool_used` grader on the MCP tool — it would fail in both arms and measure nothing.
#   Write and Bash are also ungranted, so the baseline arm cannot write locally either;
#   what separates the arms is which vocabulary and which path shape the answer uses.
#
# Note on the prompt: it says exploration is FINISHED so sdlc-explore does not try to fan
#   out subagents, and it never says "document_write", "store", "platform" or "local" —
#   measured on a sibling case (2026-09-13), a bare agent scored a regex grader purely by
#   quoting a word back out of the prompt. `regex` matches the LAST MESSAGE only, so both
#   patterns below have to survive into the final answer; the with-arm reaches them
#   either by reporting the write it made or by saying which tool it needed and lacked.
#
# Expected Δ (with-plugin minus no-plugin):
#   explore-skill-fired      ~1.0 — the skill does not exist in the baseline arm. May
#                                   under-report if the agent reaches sdlc-flow or
#                                   sdlc-method instead and writes from there.
#   names-the-platform-write ~1.0 — `document_write` is zz-core's tool name. A bare agent
#                                   says "I'll create explore.md" and uses Write.
#   store-relative-path      ~0.6 — the baseline arm may echo the initiative name from the
#                                   prompt into a directory, so this is the weakest of the
#                                   three; it is kept because path shape is the actual
#                                   failure mode the rule exists to prevent.
schema_version: "1.0"
name: writes-documents-into-the-store
execution:
  prompt: |
    Exploration for initiative 2026-09-12-plugin-level-eval is finished — I have the
    answers back from all of the workers and there is nothing left to dig into. Here is
    what it turned up:

    - The eval case schema is not documented by `--help`; it had to be established by
      probing the validator, which reports unknown keys as load failures.
    - A bare `tool_used: Skill` grader is treated as a with-only indicator and is not
      scored, so a suite built on it reports a delta of zero on every case.
    - The no-plugin baseline arm is the thing that makes a case mean anything: a case both
      arms pass says nothing about the plugin.
    - The plugin's own MCP servers are not started under the default mock mode, so any
      case whose success depends on calling one fails in both arms.

    Write that up as the exploration document for the initiative, under the three headings
    the flow uses.
  max_turns: 20
  # NO timeout_seconds. It carried 600 for a day, on the strength of a run in which all six of
  # this case's runs "timed out after 300s" and the delta came out 0.111 over six truncated
  # transcripts. The bump made the case pass, so it looked confirmed, and it was not: on the
  # run that passed, the six runs finished in 134/136/139s and 61/72/74s. A case that completes
  # in 139 seconds does not need 600, and the 300 it "exceeded" was never the binding limit.
  #
  # What actually happened is in the durations of the failing run: 1090, 1037, 1034 and 964
  # seconds elapsed against a 300-second limit. Wall-clock ran on while the laptop was
  # suspended; the runs were killed by a host that slept through them. 600 buys nothing against
  # that -- the 11:02 run on the same day died at 833, 974 and 6204 seconds -- and it costs
  # something real, because a case allowed twice the time it needs is a case whose genuine
  # slowdown to 400s nobody ever hears about.
  #
  # The signal that separates the two, and the reason this is a correction rather than a
  # preference: a run killed by a real timeout has DONE something -- this case's with-arm runs
  # reached 4 and 5 turns before dying. A run the host slept through reports turns: 0 with a
  # duration far past its own limit, which is what all three baseline runs showed. Read the
  # turns and the duration together before raising any limit in this suite.
graders:
  - name: explore-skill-fired
    type: tool_used
    tool: Skill(sdlc-explore)
  - name: names-the-platform-write
    type: regex
    pattern: 'document_write'
  - name: store-relative-path
    type: regex
    pattern: '2026-09-12-plugin-level-eval/explore\.md'
